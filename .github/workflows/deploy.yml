name: Deploy to Vercel

# Auto-deploy the site to Vercel production on every push to main.
# Requires one repository secret: VERCEL_TOKEN
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Create the token at https://vercel.com/account/tokens
# The org/project IDs below are identifiers (not secrets) for the
# "shreeharivansh" project on Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_YOntxOVZ4ZZ8DhNRXrJL2l0U
  VERCEL_PROJECT_ID: prj_dxnBKsqDCHuuaRc20FvXDD8HdaRi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
